/* ============================================================
   ELEVATE COMMAND CENTER  v1.0
   Single-file. Vanilla JS. localStorage. Prefix: elevate_
   ============================================================ */

const K = (s) => 'elevate_' + s;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => '$' + Math.round(Number(n)||0).toLocaleString();
const money2 = (n) => '$' + (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = (a,b) => b>0 ? Math.min(999, (a/b)*100) : 0;
const today = () => new Date().toISOString().slice(0,10);
const parseD = (s) => s ? new Date(s + 'T00:00:00') : null;

function load(key, fallback){
  try { const v = localStorage.getItem(K(key)); return v===null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function save(key, val){ localStorage.setItem(K(key), JSON.stringify(val)); if(!Sync.applyingRemote) Sync.schedulePush(); }

/* ============================================================
   CLOUD SYNC  (Firebase Firestore + Google sign-in)
   The app works fully offline with localStorage only.
   If a Firebase config + sign-in are present, all campaign data
   syncs live across every device for the signed-in user.
   ------------------------------------------------------------
   OPTION A: paste your Firebase config object below (then every
   device that loads this file is pre-wired — just sign in).
   OPTION B: leave it blank and paste the config in Settings on
   each device. A value pasted in Settings always wins.
   The Firebase web config is NOT a secret — it is safe to commit.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDoyMyYgKU0JSCs9hdStyM7P5_WNmQsxys",
  authDomain: "elevate-command-center.firebaseapp.com",
  projectId: "elevate-command-center",
  storageBucket: "elevate-command-center.firebasestorage.app",
  messagingSenderId: "310771986061",
  appId: "1:310771986061:web:5a49d1ad04510285ee3cc4",
  measurementId: "G-89VXQ1SSGF"
};

const SYNC_KEYS = ['tasks','tiers','suppliers','budget','emails','social','settings','prelog','livelog','postmortem'];

const Sync = {
  ready:false, user:null, db:null, status:'off', applyingRemote:false,
  myRev:null, unsub:null, pushTimer:null,

  config(){
    const local = load('fbconfig', null);
    const cfg = (local && local.apiKey) ? local : FIREBASE_CONFIG;
    return (cfg && cfg.apiKey) ? cfg : null;
  },
  setStatus(s){ this.status=s; updateSyncBadge(); },

  init(){
    const cfg = this.config();
    if(!cfg){ this.setStatus('off'); return; }
    if(typeof firebase==='undefined'){ this.setStatus('error'); return; }
    try{
      if(!firebase.apps.length) firebase.initializeApp(cfg);
      this.db = firebase.firestore();
      this.ready = true;
      this.setStatus('signedout');
      firebase.auth().onAuthStateChanged(u=>{ this.user=u; u? this.onSignedIn() : this.onSignedOut(); });
    }catch(e){ console.warn('Firebase init failed', e); this.setStatus('error'); }
  },

  signIn(){
    if(!this.ready){ alert('Add your Firebase config in Settings first.'); return; }
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).catch(e=>{ alert('Sign-in failed: '+e.message); });
  },
  signOut(){ if(this.ready) firebase.auth().signOut(); },

  collect(){ const o={}; SYNC_KEYS.forEach(k=>{ const v=localStorage.getItem(K(k)); if(v!==null) o[k]=v; }); return o; },
  apply(data){
    if(!data) return;
    this.applyingRemote = true;
    SYNC_KEYS.forEach(k=>{ if(data[k]!==undefined) localStorage.setItem(K(k), data[k]); });
    this.applyingRemote = false;
  },

  async onSignedIn(){
    this.setStatus('syncing');
    const ref = this.db.collection('users').doc(this.user.uid);
    try{
      const snap = await ref.get();
      if(snap.exists && snap.data().data){
        this.apply(snap.data().data);   // cloud is the source of truth on sign-in
      }else{
        await this.push(true);          // first time: seed cloud from this device
      }
    }catch(e){ console.warn(e); }
    // live updates from other devices
    if(this.unsub) this.unsub();
    this.unsub = ref.onSnapshot(doc=>{
      if(!doc.exists) return;
      const d = doc.data();
      if(d.rev && d.rev === this.myRev) return;  // ignore our own write echo
      this.apply(d.data);
      this.setStatus('synced');
      try{ render(); }catch(e){}
    }, err=>{ console.warn(err); this.setStatus('error'); });
    this.setStatus('synced');
    try{ render(); }catch(e){}
  },
  onSignedOut(){ if(this.unsub){ this.unsub(); this.unsub=null; } this.setStatus(this.ready?'signedout':'off'); },

  schedulePush(){
    if(!this.ready || !this.user) return;
    this.setStatus('syncing');
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(()=>this.push(), 900);
  },
  async push(silent){
    if(!this.ready || !this.user) return;
    this.myRev = uid()+Date.now();
    try{
      await this.db.collection('users').doc(this.user.uid).set({
        data: this.collect(), rev: this.myRev, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      if(!silent) this.setStatus('synced');
    }catch(e){ console.warn('push failed', e); this.setStatus('error'); }
  },
};

/* ============================================================
   KICKSTARTER PULL  (via your Cloudflare Worker proxy)
   The worker fetches your public project page server-side and
   returns { pledged, backers, goal, name, currency }.
   We reconcile those running TOTALS into today's live-log entry
   so cumulative revenue/backers exactly match Kickstarter.
   ============================================================ */
async function pullKickstarter(){
  const s = settings();
  if(!s.ksWorkerUrl) throw new Error('Add your Cloudflare Worker URL in Settings.');
  if(!s.ksProjectUrl) throw new Error('Add your Kickstarter project URL in Settings.');
  const url = s.ksWorkerUrl.replace(/\/+$/,'') + '/?url=' + encodeURIComponent(s.ksProjectUrl);
  const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
  if(!res.ok) throw new Error('Worker responded '+res.status);
  const d = await res.json();
  if(d.error) throw new Error(d.error);
  if(d.pledged==null && d.backers==null) throw new Error('Could not read numbers from the project page.');
  return d;
}
function applyKickstarterTotals(pledged, backers){
  const t = today();
  const log = load('livelog', []);
  const prior = log.filter(e=>e.date < t);
  const priorRev = prior.reduce((a,e)=>a+(Number(e.revenue)||0),0);
  const priorBk  = prior.reduce((a,e)=>a+(Number(e.backers)||0),0);
  const dRev = Math.max(0, Math.round((Number(pledged)||0) - priorRev));
  const dBk  = Math.max(0, (Number(backers)||0) - priorBk);
  const ex = log.find(e=>e.date===t);
  if(ex){ ex.revenue=dRev; ex.backers=dBk; ex.notes='Kickstarter auto-pull'; }
  else log.push({ date:t, revenue:dRev, backers:dBk, notes:'Kickstarter auto-pull' });
  save('livelog', log);
}
async function doKickstarterPull(btn){
  const old = btn ? btn.textContent : '';
  if(btn){ btn.disabled=true; btn.textContent='Pulling…'; }
  try{
    const d = await pullKickstarter();
    applyKickstarterTotals(d.pledged, d.backers);
    render();
    alert(`Pulled from Kickstarter${d.name?(' ("'+d.name+'")'):''}:\n\nTotal pledged: ${money(d.pledged)}\nBackers: ${d.backers}${d.goal?('\nGoal: '+money(d.goal)):''}\n\nToday's live-log entry was updated to match.`);
  }catch(e){
    alert('Kickstarter pull failed:\n\n'+e.message+'\n\n(Common causes: worker URL or project URL not set in Settings, or the worker is not deployed yet.)');
  }finally{ if(btn){ btn.disabled=false; btn.textContent=old; } }
}

function updateSyncBadge(){
  const el = document.getElementById('syncBadge'); if(!el) return;
  const map = {
    off:     ['Local only', '#8a8478', '#2c2c2c'],
    signedout:['Sign in to sync', '#c8953a', '#3a2f18'],
    syncing: ['Syncing…', '#c8763a', '#3a2a18'],
    synced:  ['Synced ✓', '#6a9e6a', '#1f2a1f'],
    error:   ['Sync error', '#c85a3a', '#3a1f18'],
  };
  const [txt,color,bg] = map[Sync.status] || map.off;
  const who = (Sync.status==='synced' && Sync.user) ? ' · '+(Sync.user.email||'') : '';
  el.textContent = txt + who;
  el.style.color = color; el.style.background = bg;
  el.style.cursor = (Sync.status==='signedout') ? 'pointer' : 'default';
}

/* ---------- DERIVED METRICS ---------- */
function settings(){ return Object.assign({}, DEFAULT_SETTINGS, load('settings', {})); }

function totals(){
  const live = load('livelog', []);
  const revenue = live.reduce((s,r)=>s+(Number(r.revenue)||0),0);
  const backers = live.reduce((s,r)=>s+(Number(r.backers)||0),0);
  const aov = backers>0 ? revenue/backers : 0;
  return { revenue, backers, aov };
}
function tierTotals(){
  const tiers = load('tiers', []);
  const rev = tiers.reduce((s,t)=>s+(Number(t.price)||0)*(Number(t.backers)||0),0);
  return { rev, tiers };
}
function phaseOf(){
  const s = settings();
  const launch = parseD(s.launchDate), end = parseD(s.endDate);
  const now = parseD(today());
  if (now < launch) return { label:'Pre-Launch', kind:'pre', days: Math.ceil((launch-now)/864e5) };
  if (now <= end)   return { label:'Live', kind:'live', days: Math.ceil((end-now)/864e5) };
  return { label: 'Fulfillment', kind:'post', days: Math.floor((now-end)/864e5) };
}

/* ---------- COLOR HELPERS ---------- */
function trafficClass(value, target, higherIsBetter=true){
  if (!target) return 'text-cream';
  const ratio = value/target;
  if (higherIsBetter) return ratio>=1 ? 'text-good' : ratio>=0.7 ? 'text-warn' : 'text-danger';
  return ratio<=1 ? 'text-good' : 'text-warn';
}

function prioChip(p){

  return `<span class="chip ${m[p]||m.Medium}">${p}</span>`;
}

function renderTaskList(){
  const all = load('tasks', []);
  let list = all.filter(t=>{
    if(taskFilter.phase!=='all' && t.phase!==taskFilter.phase) return false;
    if(taskFilter.priority!=='all' && t.priority!==taskFilter.priority) return false;
    if(taskFilter.status==='open' && t.done) return false;
    if(taskFilter.status==='done' && !t.done) return false;
    return true;
  });
  list.sort((a,b)=> (a.due||'')< (b.due||'')?-1:1);
  const el = $('taskList');
  if(!list.length){ el.innerHTML = `<div class="empty">No tasks match these filters.</div>`; return; }
  el.innerHTML = `<div class="overflow-x-auto"><table>
    <thead><tr><th></th><th>Task</th><th>Phase</th><th>Due</th><th>Priority</th><th>Notes</th><th></th></tr></thead>
    <tbody>${list.map(t=>`
      <tr class="${t.done?'opacity-50':''}">
        <td><input type="checkbox" data-id="${t.id}" class="tk-done" ${t.done?'checked':''}></td>
        <td><input class="tk-text w-full min-w-[220px]" data-id="${t.id}" value="${esc(t.text)}"></td>
        <td><select class="tk-phase" data-id="${t.id}">${PHASES.map(p=>`<option value="${p.key}" ${t.phase===p.key?'selected':''}>${esc(p.label)}</option>`).join('')}</select></td>
        <td><input type="date" class="tk-due" data-id="${t.id}" value="${esc(t.due||'')}"></td>
        <td><select class="tk-prio" data-id="${t.id}">${['High','Medium','Low'].map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select></td>
        <td><input class="tk-notes w-full min-w-[140px]" data-id="${t.id}" value="${esc(t.notes||'')}" placeholder="—"></td>
        <td><button class="tk-del text-danger" data-id="${t.id}" title="Delete">✕</button></td>
      </tr>`).join('')}</tbody></table></div>`;

  const upd=(id,fn)=>{ const tasks=load('tasks',[]); const t=tasks.find(x=>x.id===id); if(t){fn(t); save('tasks',tasks);} };
  el.querySelectorAll('.tk-done').forEach(c=>c.onchange=e=>{upd(e.target.dataset.id,t=>t.done=e.target.checked); renderTaskList();});
  el.querySelectorAll('.tk-text').forEach(c=>c.onchange=e=>upd(e.target.dataset.id,t=>t.text=e.target.value));
  el.querySelectorAll('.tk-phase').forEach(c=>c.onchange=e=>{upd(e.target.dataset.id,t=>t.phase=e.target.value); drawGantt();});

function drawGantt(){
  const ctx=$('ganttChart'); if(!ctx) return;
  const tasks=load('tasks',[]);
  // Self-contained linear time axis: x = days since base (no date-adapter CDN needed).
  const base = parseD('2025-06-01').getTime();
  const off = (d)=> (parseD(d).getTime()-base)/864e5;
  const maxOff = off('2026-03-01');
  const months=[]; let m=new Date(2025,5,1);
  while(m<=new Date(2026,2,1)){ months.push({ v:(m.getTime()-base)/864e5, l:m.toLocaleDateString('en',{month:'short',year:'2-digit'}) }); m=new Date(m.getFullYear(), m.getMonth()+1, 1); }

  const labels = PHASES.map(p=>p.label);
  const data = PHASES.map(p=>[ off(p.start), off(p.end) ]);
  const colors = PHASES.map(p=>p.color);
  if(charts.gantt) charts.gantt.destroy();
  charts.gantt = new Chart(ctx,{
    type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor:colors, borderRadius:6, barThickness:18 }]},
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(c)=>{
        const [a,b]=c.raw; const d=v=>new Date(base+v*864e5).toISOString().slice(0,10);
        const p=PHASES[c.dataIndex]; const t=tasks.filter(x=>x.phase===p.key); const done=t.filter(x=>x.done).length;
        return `${d(a)} → ${d(b)}  (${done}/${t.length} tasks done)`;
      }}}},
      scales:{
        x:{ type:'linear', min:0, max:maxOff,
            afterBuildTicks:(axis)=>{ axis.ticks = months.map(mo=>({value:mo.v})); },
            ticks:{ color:'#bdb6a8', autoSkip:false, callback:(v)=>{ const f=months.find(mo=>Math.abs(mo.v-v)<0.5); return f?f.l:''; } },
            grid:{color:'#333'} },
        y:{ grid:{color:'#2a2a2a'}, ticks:{color:'#f0ece4'} }
      }
    }
  });
}

  el.innerHTML=`<div class="overflow-x-auto"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}${extraHead}<th></th></tr></thead><tbody>

function exportCSV(){
  const out=[];
  const push=(title,heads,rows)=>{ out.push(title); out.push(heads.join(',')); rows.forEach(r=>out.push(r.map(csvCell).join(','))); out.push(''); };
  const csvCell=(x)=>{ const s=String(x??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const settingsObj=settings();
  push('SETTINGS',['key','value'],Object.entries(settingsObj));
  push('TIERS',['name','price','backers','revenue'], load('tiers',[]).map(t=>[t.name,t.price,t.backers,(t.price*t.backers)]));
  push('PRE-LAUNCH LOG',['date','vip','optins','followers','notes'], load('prelog',[]).map(r=>[r.date,r.vip,r.optins,r.followers,r.notes]));
  push('LIVE LOG',['date','revenue','backers','notes'], load('livelog',[]).map(r=>[r.date,r.revenue,r.backers,r.notes]));
  push('TASKS',['phase','task','due','priority','done','notes'], load('tasks',[]).map(t=>[phaseLabel(t.phase),t.text,t.due,t.priority,t.done,t.notes]));
  push('SUPPLIERS',['item','supplier','unit','qty','lead','backup','status'], load('suppliers',[]).map(x=>[x.item,x.supplier,x.unit,x.qty,x.lead,x.backup,x.status]));
  push('BUDGET',['item','estimated','actual'], load('budget',[]).map(b=>[b.item,b.est,b.act]));
  push('EMAILS',['sequence','#','subject','status','planned','actual','open%','notes'], load('emails',[]).map(e=>[e.seq,e.num,e.subj,e.status,e.planned,e.actual,e.open,e.notes]));
  push('SOCIAL',['date','platform','type','topic','status','notes'], load('social',[]).map(s=>[s.date,s.platform,s.type,s.topic,s.status,s.notes]));
  downloadFile('elevate_data_'+today()+'.csv', out.join('\n'), 'text/csv');
}
function downloadFile(name, content, type){
  const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
}

    <thead><tr><th>Date</th><th>Platform</th><th>Type</th><th>Topic / description</th><th>Status</th><th>Notes</th><th></th></tr></thead>
    <tbody>${social.slice().sort((a,b)=>(a.date<b.date?-1:1)).map(c=>`<tr>
      <td><input type="date" class="so" data-id="${c.id}" data-f="date" value="${esc(c.date)}"></td>
      <td><input class="so w-32" data-id="${c.id}" data-f="platform" value="${esc(c.platform)}"></td>
      <td><select class="so" data-id="${c.id}" data-f="type">${['Reel','Post','Story','Live','YouTube'].map(t=>`<option ${c.type===t?'selected':''}>${t}</option>`).join('')}</select></td>
      <td><input class="so w-full min-w-[200px]" data-id="${c.id}" data-f="topic" value="${esc(c.topic)}"></td>
      <td><select class="so" data-id="${c.id}" data-f="status">${SS.map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><input class="so w-full min-w-[120px]" data-id="${c.id}" data-f="notes" value="${esc(c.notes)}"></td>
      <td><button class="so-del text-danger" data-id="${c.id}">✕</button></td>
    </tr>`).join('')}</tbody></table></div>
    <button id="so-add" class="mt-3 bg-panel2 border border-edge rounded-lg px-3 py-1.5 text-sm hover:border-amber">+ Add content row</button>
  </div>`;

  v.innerHTML=html;
  const updE=(id,f,val)=>{const a=load('emails',[]);const e=a.find(x=>x.id===id);if(e){e[f]=val;save('emails',a);}};
  const updS=(id,f,val)=>{const a=load('social',[]);const e=a.find(x=>x.id===id);if(e){e[f]=val;save('social',a);}};
  v.querySelectorAll('.em').forEach(i=>i.onchange=e=>updE(e.target.dataset.id,e.target.dataset.f,e.target.value));
  v.querySelectorAll('.so').forEach(i=>i.onchange=e=>updS(e.target.dataset.id,e.target.dataset.f,e.target.value));
  v.querySelectorAll('.em-del').forEach(b=>b.onclick=e=>{save('emails',load('emails',[]).filter(x=>x.id!==e.target.dataset.id));renderContent(v);});
  v.querySelectorAll('.so-del').forEach(b=>b.onclick=e=>{save('social',load('social',[]).filter(x=>x.id!==e.target.dataset.id));renderContent(v);});
  $('em-add').onclick=()=>{const a=load('emails',[]);a.push({id:uid(),seq:'New sequence',num:1,subj:'',status:'Not Written',planned:'',actual:'',open:'',notes:''});save('emails',a);renderContent(v);};
  $('so-add').onclick=()=>{const a=load('social',[]);a.push({id:uid(),date:today(),platform:'@gabrielsantiago',type:'Post',topic:'',status:'Planned',notes:''});save('social',a);renderContent(v);};
}

/* ============================================================
   7. POST-MORTEM
   ============================================================ */
function renderPostmortem(v){
  const s=settings();
  const pm=load('postmortem',{ratings:{},worked:'',change:'',lesson:''});
  const {revenue,backers,aov}=totals();
  const tiers=load('tiers',[]);
  const live=load('livelog',[]).slice().sort((a,b)=>(a.date<b.date?-1:1));

  // days to public goal
  let daysToGoal='—', cum=0;
  for(let i=0;i<live.length;i++){ cum+=Number(live[i].revenue)||0; if(cum>=s.publicGoal){ daysToGoal=i+1+' log entr'+(i===0?'y':'ies'); break; } }
  const byRev=tiers.map(t=>({n:t.name,r:(Number(t.price)||0)*(Number(t.backers)||0),b:Number(t.backers)||0})).filter(t=>t.b>0);
  const topRev=byRev.slice().sort((a,b)=>b.r-a.r)[0];
  const topBk=byRev.slice().sort((a,b)=>b.b-a.b)[0];

  let html=sectionTitle('Post-Mortem','auto-filled stats + your ratings and notes');
  html+=`<div class="card p-5 mb-5 grid sm:grid-cols-3 gap-4 text-center">
    ${[['Total raised',money(revenue)],['Total backers',backers],['Final AOV',money2(aov)],
       ['Days to public goal',daysToGoal],['Top tier by revenue',topRev?topRev.n:'—'],['Top tier by backers',topBk?topBk.n:'—']]
      .map(([k,val])=>`<div class="bg-ink rounded-lg p-3 border border-edge"><div class="text-xs text-cream/50">${k}</div><div class="text-lg font-bold text-amber">${val}</div></div>`).join('')}
  </div>`;

  html+=`<div class="card p-5 mb-5">${sectionTitle('Ratings (1–5)')}<div class="grid sm:grid-cols-2 gap-x-8 gap-y-4">
    ${PM_RATINGS.map(([key,label])=>{
      const val=pm.ratings[key]??3;
      return `<div><div class="flex justify-between text-sm mb-1"><span>${label}</span><span class="font-bold text-amber" id="rv-${key}">${val}</span></div>
        <input type="range" min="1" max="5" step="1" value="${val}" class="pm-rate w-full" data-key="${key}"></div>`;
    }).join('')}
  </div></div>`;

  html+=`<div class="card p-5 mb-5 space-y-4">
    <div><label class="text-sm font-semibold block mb-1">What worked</label><textarea id="pm-worked" rows="4" class="w-full">${esc(pm.worked)}</textarea></div>
    <div><label class="text-sm font-semibold block mb-1">What to change next time</label><textarea id="pm-change" rows="4" class="w-full">${esc(pm.change)}</textarea></div>
    <div><label class="text-sm font-semibold block mb-1">Biggest single lesson</label><textarea id="pm-lesson" rows="3" class="w-full">${esc(pm.lesson)}</textarea></div>
  </div>`;

  html+=`<div class="card p-5">${sectionTitle('Campaign History Paragraph','auto-generated — ready to copy')}
    <div id="pm-history" class="bg-ink border border-edge rounded-lg p-4 text-sm leading-relaxed text-cream/90 whitespace-pre-wrap"></div>
    <div class="flex gap-3 mt-3">
      <button id="pm-copy" class="bg-amber text-ink font-semibold rounded-lg px-4 py-2">Copy paragraph</button>
      <button id="pm-export" class="bg-panel2 border border-edge rounded-lg px-4 py-2 hover:border-amber">Export post-mortem as text</button>
    </div>
  </div>`;

  v.innerHTML=html;

  function genHistory(){
    const p=load('postmortem',{ratings:{},worked:'',change:'',lesson:''});
    return `Elevate — Kickstarter campaign by Dr. Gabriel Santiago. Launched ${s.launchDate}, closed ${s.endDate}. `+
      `Raised ${money(revenue)} from ${backers} backers (final AOV ${money2(aov)}; public goal ${money(s.publicGoal)}, real target ${money(s.realTarget)}). `+
      (topRev?`Top tier by revenue was ${topRev.n}; `:'')+(topBk?`top tier by backers was ${topBk.n}. `:'')+
      `Reached the public goal in ${daysToGoal}. `+
      `Overall rating: ${p.ratings.overall??3}/5. `+
      (p.worked?`What worked: ${p.worked} `:'')+
      (p.change?`What to change: ${p.change} `:'')+
      (p.lesson?`Biggest lesson: ${p.lesson}`:'');
  }
  $('pm-history').textContent=genHistory();

  const savePM=()=>{ const p=load('postmortem',{ratings:{},worked:'',change:'',lesson:''});
    p.worked=$('pm-worked').value; p.change=$('pm-change').value; p.lesson=$('pm-lesson').value; save('postmortem',p);
    $('pm-history').textContent=genHistory(); };
  ['pm-worked','pm-change','pm-lesson'].forEach(id=>$(id).oninput=savePM);
  v.querySelectorAll('.pm-rate').forEach(r=>r.oninput=e=>{
    const p=load('postmortem',{ratings:{},worked:'',change:'',lesson:''}); p.ratings[e.target.dataset.key]=Number(e.target.value); save('postmortem',p);
    $('rv-'+e.target.dataset.key).textContent=e.target.value; $('pm-history').textContent=genHistory();
  });
  $('pm-copy').onclick=()=>{ navigator.clipboard.writeText($('pm-history').textContent).then(()=>{$('pm-copy').textContent='Copied!';setTimeout(()=>$('pm-copy').textContent='Copy paragraph',1500);}); };
  $('pm-export').onclick=()=>{
    const p=load('postmortem',{ratings:{},worked:'',change:'',lesson:''});
    let txt='ELEVATE CAMPAIGN POST-MORTEM\n'+'='.repeat(40)+'\n\n';
    txt+=`Total raised: ${money(revenue)}\nTotal backers: ${backers}\nFinal AOV: ${money2(aov)}\nDays to public goal: ${daysToGoal}\n`;
    txt+=`Top tier by revenue: ${topRev?topRev.n:'—'}\nTop tier by backers: ${topBk?topBk.n:'—'}\n\nRATINGS (1-5)\n`;
    PM_RATINGS.forEach(([k,l])=>txt+=`  ${l}: ${p.ratings[k]??3}\n`);
    txt+=`\nWHAT WORKED\n${p.worked||'—'}\n\nWHAT TO CHANGE\n${p.change||'—'}\n\nBIGGEST LESSON\n${p.lesson||'—'}\n\n`;
    txt+='CAMPAIGN HISTORY\n'+genHistory()+'\n';
    downloadFile('elevate_postmortem_'+today()+'.txt', txt, 'text/plain');
  };
}

/* ============================================================
   8. SETTINGS
   ============================================================ */
function renderSettings(v){
  const s=settings();
  const F=[
    ['publicGoal','Public funding goal ($)','number'],
    ['realTarget','Real revenue target ($)','number'],
    ['aovTarget','Target AOV ($)','number'],
    ['backerTarget','Backers needed','number'],
    ['launchDate','Launch date','date'],
    ['endDate','Campaign end date','date'],
    ['vipMin','$1 VIP minimum','number'],
    ['vipTarget','$1 VIP target','number'],
    ['optinsMin','New opt-ins minimum','number'],
    ['optinsTarget','New opt-ins target','number'],
    ['kfollowMin','KS pre-launch followers minimum','number'],
  ];
  let html=sectionTitle('Settings');
  html+=`<div class="card p-5 mb-5"><h3 class="font-bold mb-3">Core campaign targets</h3>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
    ${F.map(([k,label,t])=>`<div><label class="text-xs text-cream/60 block mb-1">${label}</label><input id="set-${k}" type="${t}" value="${esc(s[k])}" class="w-full"></div>`).join('')}
    </div>
    <button id="set-save" class="mt-4 bg-amber text-ink font-semibold rounded-lg px-5 py-2">Save settings</button>
    <span id="set-msg" class="ml-3 text-good text-sm"></span>
  </div>`;

  // ---- Cloud sync ----
  const cfgLocal = load('fbconfig', null);
  const cfgActive = Sync.config();
  const signedIn = Sync.ready && Sync.user;
  html+=`<div class="card p-5 mb-5"><h3 class="font-bold mb-1">☁ Cloud sync (same data on every device)</h3>
    <p class="text-xs text-cream/50 mb-3">Paste your Firebase config below, then sign in with Google. Your data then lives in the cloud and syncs across all your devices. See CLOUD-SETUP.md for the 10-minute setup. The Firebase web config is not a secret.</p>
    <label class="text-xs text-cream/60 block mb-1">Firebase config (paste the whole <code>{ ... }</code> object, or just the JSON)</label>
    <textarea id="fb-config" rows="6" class="w-full font-mono text-xs" placeholder='{
  "apiKey": "...",
  "authDomain": "your-project.firebaseapp.com",
  "projectId": "your-project",
  "appId": "..."
}'>${cfgLocal?esc(JSON.stringify(cfgLocal,null,2)):''}</textarea>
    <div class="flex flex-wrap gap-3 mt-3 items-center">
      <button id="fb-save" class="bg-amber text-ink font-semibold rounded-lg px-4 py-2">Save config & connect</button>
      ${cfgActive ? (signedIn
        ? `<button id="fb-signout" class="bg-panel2 border border-edge rounded-lg px-4 py-2 hover:border-amber">Sign out (${esc(Sync.user.email||'signed in')})</button>`
        : `<button id="fb-signin" class="bg-good/20 text-good border border-good/40 rounded-lg px-4 py-2 hover:bg-good/30">Sign in with Google</button>`)
        : '<span class="text-xs text-cream/40">No config saved yet.</span>'}
      <span class="chip" id="fb-status" style="background:#2c2c2c;color:#8a8478"></span>
    </div>
    ${cfgLocal?`<button id="fb-clear" class="mt-3 text-xs text-danger underline">Remove cloud config from this device</button>`:''}
  </div>`;

  // ---- Kickstarter live numbers ----
  html+=`<div class="card p-5 mb-5"><h3 class="font-bold mb-1">⤓ Kickstarter live numbers</h3>
    <p class="text-xs text-cream/50 mb-3">Pull total pledged + backer count straight from your project page through your free Cloudflare Worker. See CLOUD-SETUP.md to deploy the worker (code is in kickstarter-worker.js).</p>
    <div class="grid gap-3">
      <div><label class="text-xs text-cream/60 block mb-1">Cloudflare Worker URL</label><input id="set-ksWorkerUrl" value="${esc(s.ksWorkerUrl||'')}" placeholder="https://elevate-ks.YOUR-NAME.workers.dev" class="w-full"></div>
      <div><label class="text-xs text-cream/60 block mb-1">Kickstarter project URL</label><input id="set-ksProjectUrl" value="${esc(s.ksProjectUrl||'')}" placeholder="https://www.kickstarter.com/projects/.../elevate" class="w-full"></div>
    </div>
    <div class="flex flex-wrap gap-3 mt-3">
      <button id="ks-save" class="bg-amber text-ink font-semibold rounded-lg px-4 py-2">Save</button>
      <button id="ks-test" class="bg-panel2 border border-edge rounded-lg px-4 py-2 hover:border-amber">Test connection / pull now</button>
    </div>
  </div>`;

  html+=`<div class="card p-5 mb-5"><h3 class="font-bold mb-3">Backup & restore</h3>
    <div class="flex flex-wrap gap-3">
      <button id="exp-json" class="bg-panel2 border border-edge rounded-lg px-4 py-2 hover:border-amber">⬇ Export all data (JSON)</button>
      <label class="bg-panel2 border border-edge rounded-lg px-4 py-2 hover:border-amber cursor-pointer">⬆ Import JSON backup<input id="imp-json" type="file" accept="application/json,.json" class="hidden"></label>
    </div>
    <p class="text-xs text-cream/50 mt-2">Importing replaces all current data with the contents of the backup file.</p>
  </div>`;

  html+=`<div class="card p-5 mb-5" style="border-color:#c85a3a55"><h3 class="font-bold mb-2 text-danger">Danger zone</h3>
    <button id="reset-all" class="bg-danger/20 text-danger border border-danger/40 rounded-lg px-4 py-2 hover:bg-danger/30">Reset all data</button>
    <p class="text-xs text-cream/50 mt-2">Wipes everything in this browser and re-loads the pre-populated campaign template.</p>
  </div>`;

  html+=`<div class="text-center text-xs text-cream/40 py-4">Elevate Command Center v1.1 · ${Sync.config()?(Sync.user?'cloud sync on':'cloud sync configured — sign in'):'local-only (set up cloud sync above)'}</div>`;

  v.innerHTML=html;

  $('set-save').onclick=()=>{
    const ns={...s}; F.forEach(([k,,t])=>{ const val=$('set-'+k).value; ns[k]= t==='number'? (Number(val)||0): val; });
    save('settings',ns); $('set-msg').textContent='Saved ✓'; setTimeout(()=>$('set-msg').textContent='',1500);
  };

  // cloud sync handlers
  const fbStatus=$('fb-status'); if(fbStatus){ const m={off:'Local only',signedout:'Connected · not signed in',syncing:'Syncing…',synced:'Synced ✓',error:'Error'}; fbStatus.textContent=m[Sync.status]||''; }
  if($('fb-save')) $('fb-save').onclick=()=>{
    const raw=$('fb-config').value.trim();
    if(!raw){ alert('Paste your Firebase config first.'); return; }
    let cfg;
    try{
      // accept strict JSON first; otherwise parse the JS object literal Firebase shows
      // (handles unquoted keys and string values containing colons, e.g. appId "1:23:web:ab")
      try { cfg = JSON.parse(raw); }
      catch(_) { cfg = (new Function('return (' + raw + ')'))(); }
    }catch(e){ alert('That config could not be parsed. Paste the object exactly as Firebase shows it (the part inside the curly braces).\n\n'+e.message); return; }
    if(!cfg.apiKey || !cfg.projectId){ alert('Config is missing apiKey or projectId.'); return; }
    save('fbconfig', cfg);
    alert('Config saved. Connecting… now click "Sign in with Google".');
    location.reload();
  };
  if($('fb-signin')) $('fb-signin').onclick=()=>Sync.signIn();
  if($('fb-signout')) $('fb-signout').onclick=()=>Sync.signOut();
  if($('fb-clear')) $('fb-clear').onclick=()=>{ if(confirm('Remove cloud config from THIS device? Your cloud data stays safe; this device just stops syncing until you re-add it.')){ localStorage.removeItem(K('fbconfig')); location.reload(); } };

  // kickstarter handlers
  const saveKs=()=>{ const ns=settings(); ns.ksWorkerUrl=$('set-ksWorkerUrl').value.trim(); ns.ksProjectUrl=$('set-ksProjectUrl').value.trim(); save('settings',ns); };
  if($('ks-save')) $('ks-save').onclick=()=>{ saveKs(); alert('Kickstarter settings saved.'); };
  if($('ks-test')) $('ks-test').onclick=(e)=>{ saveKs(); doKickstarterPull(e.currentTarget); };
  $('exp-json').onclick=()=>{
    const dump={}; for(let i=0;i<localStorage.length;i++){ const key=localStorage.key(i); if(key.startsWith('elevate_')) dump[key]=localStorage.getItem(key); }
    downloadFile('elevate_backup_'+today()+'.json', JSON.stringify(dump,null,2), 'application/json');
  };
  $('imp-json').onchange=e=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{ try{
      const data=JSON.parse(reader.result);
      if(!confirm('This will replace all current data. Continue?'))return;
      Object.keys(localStorage).filter(k=>k.startsWith('elevate_')).forEach(k=>localStorage.removeItem(k));
      Object.entries(data).forEach(([k,val])=>{ if(k.startsWith('elevate_')) localStorage.setItem(k, val); });
      alert('Backup restored.'); location.reload();
    }catch(err){ alert('Could not read that file: '+err.message); } };
    reader.readAsText(file);
  };
  $('reset-all').onclick=()=>{
    if(!confirm('Reset ALL data and reload the campaign template? This cannot be undone.'))return;
    if(!confirm('Are you absolutely sure? Everything you have entered will be erased.'))return;
    Object.keys(localStorage).filter(k=>k.startsWith('elevate_')).forEach(k=>localStorage.removeItem(k));
    location.reload();
  };
}

/* ============================================================
   BOOT
   ============================================================ */
ensureSeed();
renderNav();
render();
Sync.init();
</script>
</body>
</html>
